<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>DhiRise · 1 / 18</title>
<link rel="icon" href="assets/dhirise-logo.png" type="image/png">
<link rel="preload" as="image" href="assets/interview%20bg/Q1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Mukta:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/question.css">
</head>
<body>
<main class="qscreen">

  <header class="topbar">
    <span class="who" id="who">Student</span>
    <span class="step">1 / 18</span>
    <span class="spacer" aria-hidden="true"></span>
  </header>
  <div class="track" role="progressbar" aria-label="Question 1 of 18" aria-valuemin="0" aria-valuemax="18" aria-valuenow="1"><i></i></div>

  <!-- the question panel holds the question and the four options, nothing else -->
  <section class="panel" id="panel" aria-labelledby="qText">
    <h1 id="qText">A holiday morning. No alarm. What does your body do on its own?</h1>
    <div class="options" role="radiogroup" aria-labelledby="qText" id="options">
      <button type="button" role="radio" aria-checked="false" data-choice="1">I wake early. My mind is already running.</button>
      <button type="button" role="radio" aria-checked="false" data-choice="2">I wake hungry and ready. A delay makes me sharp.</button>
      <button type="button" role="radio" aria-checked="false" data-choice="3">I stay under the blanket. The start is slow and heavy.</button>
      <button type="button" role="radio" aria-checked="false" data-choice="4">It changes. Some mornings I am up, some I cannot move.</button>
    </div>
  </section>

</main>

<!-- tip: its own card over the photo, above the panel -->
<aside class="tip" id="tip" hidden aria-live="polite">
  <b>DhiRise</b>
  <p id="tipText"></p>
  <i class="drain" id="drain" aria-hidden="true"></i>
</aside>

<nav class="qnav">
  <button type="button" class="back" id="back">Back</button>
  <button type="button" class="next" id="next" disabled>Next</button>
</nav>

<script src="js/question.js"></script>
<script src="js/q1.js"></script>
<script src="js/music.js"></script>
</body>
</html>
