<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manas Darpan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@300;400;500;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: one centred "stage" like a lamp-lit mandap at night; chakra-coloured progress rail on top, one question at a time, report as a mirror at the end. */
:root{
  --night:#16122b; --night-2:#1f1a3a; --panel:#262046; --line:#3b3466;
  --ink:#f5eee2; --muted:#b9b0cf; --faint:#8a82a6; --gold:#e9b95c;
  --c1:#e5483e; --c2:#f08a3c; --c3:#f2c94c; --c4:#4fb67a; --c5:#3fa2e2; --c6:#7466e0; --c7:#b673e2;
  --vata:#7fb8e6; --pitta:#f08a3c; --kapha:#55b98a;
  --sattva:#f2dc9b; --rajas:#e5483e; --tamas:#7466e0;
  --f-display:"Yatra One","Tiro Devanagari Sanskrit",Georgia,serif;
  --f-body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-skt:"Tiro Devanagari Sanskrit",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(1200px 600px at 50% -10%, #2c2456 0%, transparent 60%),radial-gradient(800px 500px at 100% 110%, #241c45 0%, transparent 60%);
  background-attachment:fixed}
.app{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;min-height:100%;display:flex;flex-direction:column;gap:22px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px;color:var(--gold)}
.brand span{font-family:var(--f-skt);color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font:500 14px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--faint)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* chakra progress */
.rail{display:flex;flex-direction:column;gap:8px}
.segs{display:grid;grid-template-columns:repeat(18,1fr);gap:4px}
.seg{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.seg.done i{transform:scaleX(1)}
.seg.now{box-shadow:0 0 0 1px var(--c),0 0 12px var(--c)}
.seg.now i{transform:scaleX(.5)}
.railmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:10px;flex-wrap:wrap}
.railmeta .ch{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tn{font-variant-numeric:tabular-nums}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;gap:22px}
.enter{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-block:30px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,68px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.intro .skt{font-family:var(--f-skt);color:var(--gold);font-size:20px;margin:0 0 18px}
.intro p{color:var(--muted);max-width:52ch;margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;max-width:380px}
.field label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input{background:var(--night-2);border:1px solid var(--line);color:var(--ink);font:400 19px var(--f-body);padding:12px 14px;border-radius:12px}
.cta{margin-top:18px;background:var(--gold);color:#22180a;border:0;font:700 17px var(--f-body);padding:13px 26px;border-radius:999px;cursor:pointer;transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.cta:disabled{opacity:.35;cursor:default;transform:none}
.mandala{width:100%;max-width:340px;justify-self:center;aspect-ratio:1}
.mandala svg{width:100%;height:100%}
.spin{animation:spin 60s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* question */
.qhead{display:flex;flex-direction:column;gap:10px}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--c);color:var(--ink);padding:4px 12px 4px 8px;border-radius:999px;font-size:14px}
.badge .skt{font-family:var(--f-skt);color:var(--c)}
.qtext{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.2vw,40px);line-height:1.2;margin:0;text-wrap:balance;max-width:28ch}
.hint{color:var(--faint);font-size:14px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:16px;padding:18px 18px 18px 58px;font:400 18px/1.4 var(--f-body);cursor:pointer;min-height:84px;
  transition:border-color .2s,transform .15s,background .2s;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:hover{border-color:var(--c);transform:translateY(-2px)}
.opt .k{position:absolute;left:16px;top:18px;width:28px;height:28px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;font-size:14px;color:var(--muted);z-index:1}
.opt .t{position:relative;z-index:1;display:block}
.opt .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);opacity:.14;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.opt .pc{position:relative;z-index:1;display:none;margin-top:6px;font-size:14px;color:var(--muted)}
.opt .pc b{color:var(--ink);font-weight:700}
.revealed .opt .pc{display:block}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));box-shadow:0 0 0 1px var(--c),0 10px 30px -12px var(--c)}
.opt.sel .k{background:var(--c);border-color:var(--c);color:#16122b;font-weight:700}
.opt.sel .fill{opacity:.28}
.together{min-height:56px;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:var(--night-2);border:1px dashed var(--line);color:var(--muted)}
.together .big{font-family:var(--f-display);font-size:30px;color:var(--c);line-height:1;min-width:2.6ch}
.together strong{color:var(--ink);font-weight:500}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot{font-size:13px;color:var(--faint)}

/* reading */
.reading{flex:1;display:grid;place-items:center;text-align:center;gap:16px;padding-block:60px}
.reading h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0}
.reading svg{width:160px;height:160px}

/* report */
.rep-head{display:flex;flex-direction:column;gap:6px}
.rep-head .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.rep-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5.5vw,52px);margin:0;line-height:1.1;text-wrap:balance}
.rep-head p{margin:0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card h3{margin:0;font:500 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.card .lead{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted)}
.wide{grid-column:1/-1}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
.lg i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.lg small{display:block;color:var(--faint);font-size:13px;line-height:1.2}
.lg b{font-variant-numeric:tabular-nums;font-size:20px;font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.bar .tr{height:12px;background:var(--night-2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;background:var(--c);border-radius:6px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.radar svg{width:100%;max-width:420px;height:auto;align-self:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
ul.tick{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.tick li{padding-left:22px;position:relative;color:var(--ink)}
ul.tick li::before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--c);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:15px}
details.host{background:var(--night-2);border:1px dashed var(--line);border-radius:18px;padding:16px 20px}
details.host summary{cursor:pointer;color:var(--muted);font-weight:500}
details.host ul{margin:12px 0 0;padding-left:18px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--faint)}

@media (max-width:720px){
  .intro{grid-template-columns:1fr;gap:10px;padding-block:10px}
  .mandala{max-width:200px;order:-1}
  .opts,.grid,.cols{grid-template-columns:1fr}
  .segs{gap:2px}
  .opt{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Manas Darpan</b><span>मनस् दर्पण</span></div>
    <div class="tools">
      <button class="ghost" id="fsBtn" type="button">Full screen</button>
      <button class="ghost" id="resetBtn" type="button">New student</button>
    </div>
  </header>
  <div class="rail" id="rail" hidden>
    <div class="segs" id="segs"></div>
    <div class="railmeta"><span class="ch" id="chLabel"></span><span class="tn" id="count"></span></div>
  </div>
  <main class="stage" id="stage"></main>
</div>

<script>
const CH=[
 {n:"Muladhara",d:"मूलाधार",m:"Roots & routine",c:"var(--c1)"},
 {n:"Svadhisthana",d:"स्वाधिष्ठान",m:"Feelings & flow",c:"var(--c2)"},
 {n:"Manipura",d:"मणिपूर",m:"Willpower & effort",c:"var(--c3)"},
 {n:"Anahata",d:"अनाहत",m:"Heart & people",c:"var(--c4)"},
 {n:"Vishuddha",d:"विशुद्ध",m:"Voice & memory",c:"var(--c5)"},
 {n:"Ajna",d:"आज्ञा",m:"Clarity & direction",c:"var(--c6)"},
 {n:"Sahasrara",d:"सहस्रार",m:"Dreams & purpose",c:"var(--c7)"}
];
// option: [text, dosha weights, guna, balance 0-3, indicative seed %, subject tag]
const Q=[
 [0,"A holiday morning with no alarm. What does your body do on its own?",[
  ["Wakes early and restless. The mind is already running.","v2","r",1,31],
  ["Wakes at a fixed hour, hungry and ready to start.","p2","r",2,24],
  ["Stays under the blanket. A slow, heavy start.","k2","t",1,33],
  ["Rises with the light, calm and fresh.","k1p1","s",3,12]]],
 [0,"You're deep into studying and a meal gets skipped. What happens next?",[
  ["I forget to eat, then feel shaky or spaced out.","v2","r",1,29],
  ["I get irritable. Hunger makes me snappy.","p2","r",1,34],
  ["I barely notice. I can go long without food.","k2","t",2,17],
  ["It rarely happens. I eat at regular times.","k1","s",3,20]]],
 [0,"Picture your study table right now. It looks like…",[
  ["Several open books and ideas scattered everywhere.","v2","r",1,36],
  ["Sorted by priority, with a plan pinned up.","p2","r",2,18],
  ["Comfortable but cluttered. It rarely changes.","k2","t",1,30],
  ["Simple and clean. Only what I need today.","p1k1","s",3,16]]],
 [1,"A result comes back lower than you hoped. The first wave inside you is…",[
  ["Worry. What will happen now?","v2","r",1,38],
  ["Anger, at myself or at the unfairness.","p2","r",1,22],
  ["A quiet sadness that stays for days.","k2","t",0,27],
  ["A pause, then: what can I learn from this?","p1","s",3,13]]],
 [1,"Which weather feels most like your inner mood these days?",[
  ["A windy day, changing every hour.","v2","r",1,32],
  ["A hot afternoon, bright and intense.","p2","r",2,21],
  ["Monsoon clouds, heavy and slow.","k2","t",1,29],
  ["A clear morning sky, calm and open.","v1k1","s",3,18]]],
 [1,"Forty minutes into a lecture, your mind is usually…",[
  ["Wandering through ten other thoughts.","v2","r",1,41],
  ["Arguing with the teacher in my head.","p2","r",2,14],
  ["Drifting toward sleep.","k2","t",1,30],
  ["Still with it, taking notes without effort.","p1","s",3,15]]],
 [2,"The exam is 30 days away. Left to yourself, you would…",[
  ["Study in bursts with gaps, then rush in the last week.","v2","r",1,44],
  ["Make a timetable on day one and track every chapter.","p2","r",2,19],
  ["Start slowly, but keep a steady pace once going.","k2","t",2,22],
  ["Do a little daily, with planned revision rounds.","p1k1","s",3,15]]],
 [2,"In a long study session, what makes you lose steam?",[
  ["Restlessness. After 20 minutes I need to move.","v2","r",1,39],
  ["A problem that won't give in. Frustration builds.","p2","r",1,25],
  ["I can keep sitting, but less goes in.","k2","t",1,24],
  ["I take short breaks before I tire.","k1","s",3,12]]],
 [2,"A difficult logic problem sits in front of you. It feels like…",[
  ["Exciting at first, then I jump to something else.","v2","r",1,30],
  ["A challenge I must beat.","p2","r",2,27],
  ["A wall. I'd rather do something familiar.","k2","t",0,28],
  ["A puzzle I can break into small steps.","p1v1","s",3,15]]],
 [3,"In a group study, you're usually the one who…",[
  ["Brings new ideas and keeps the talk going.","v2","r",2,28],
  ["Takes charge and keeps everyone on track.","p2","r",2,22],
  ["Listens, supports, and keeps the mood easy.","k2","s",2,33],
  ["Quietly helps whoever is stuck.","k1","s",3,17]]],
 [3,"On a low day, where do you take your feelings?",[
  ["To many people, briefly. Then I move on.","v2","r",1,21],
  ["Nowhere. I handle it myself.","p2","r",1,31],
  ["I go quiet and keep it inside.","k2","t",0,34],
  ["To one or two people I trust.","k1","s",3,14]]],
 [4,"The teacher suddenly asks you a question in class. You…",[
  ["Speak fast and sometimes lose the thread.","v2","r",1,30],
  ["Answer confidently, even if not fully sure.","p2","r",2,20],
  ["Freeze, or keep it very short.","k2","t",0,37],
  ["Take a breath and answer simply.","p1","s",3,13]]],
 [4,"How does learning stay with you?",[
  ["I pick it up fast, and it fades fast.","v2","r",1,40],
  ["Seeing it once, clearly, is enough.","p2","r",2,18],
  ["Slow to learn, but once it's in, it stays.","k2","s",2,29],
  ["Writing it in my own words makes it stay.","p1k1","s",3,13]]],
 [5,"Someone asks, “What do you want to become?” Inside, you feel…",[
  ["Many answers. It changes every few months.","v2","r",1,37],
  ["Certain. I've decided and I'm going for it.","p2","r",3,17],
  ["Unsure. I may go with what family suggests.","k2","t",0,29],
  ["A direction is forming. I'm exploring calmly.","k1","s",2,17]]],
 [5,"Which kind of class leaves you feeling heaviest?",[
  ["Memory-heavy: history dates, biology terms.","v1","r",1,33,"mem"],
  ["Writing-heavy: essays, literature, long answers.","p1","r",1,22,"lang"],
  ["Speed and numbers: maths, physics, timed problems.","k1","t",1,36,"num"],
  ["None in particular. It depends on the teacher.","","s",3,9,"none"]]],
 [5,"The night before an important day, your sleep is…",[
  ["Light and broken. The mind keeps working.","v2","r",1,42],
  ["Short but deep. I wake with a to-do list.","p2","r",2,19],
  ["Long and heavy. Waking is hard.","k2","t",1,24],
  ["Steady. I sleep on time.","k1","s",3,15]]],
 [6,"Close your eyes and picture yourself ten years from now. You see…",[
  ["Travelling, creating, a life full of colour.","v2","r",2,26],
  ["At the top, respected and leading.","p2","r",2,31],
  ["Settled and secure, family close by.","k2","s",2,27],
  ["Doing work that genuinely helps people.","k1p1","s",3,16]]],
 [6,"What sits heaviest on your heart right now?",[
  ["The weight of everyone's expectations.","p1","r",1,34],
  ["A fear that I'm not good enough.","v1","t",0,28],
  ["Distractions: the phone, people, noise.","v1","r",1,29],
  ["Nothing heavy. I'm at peace with my pace.","k1","s",3,9]]]
];
const parseD=s=>{const o={v:0,p:0,k:0};(s.match(/[vpk]\d/g)||[]).forEach(x=>o[x[0]]+=+x[1]);return o};

/* local tallies: every completed session on this device adds real answers */
const KEY="manasDarpan.v1";
function loadStore(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.counts)return s}catch(e){}return{sessions:0,counts:Q.map(q=>q[2].map(()=>0))}}
function saveStore(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let store=loadStore();
function pcts(qi,pick){
  const base=Q[qi][2].map((o,i)=>o[4]*0.4+(store.counts[qi][i]||0)+(i===pick?1:0));
  const t=base.reduce((a,b)=>a+b,0);
  let r=base.map(b=>Math.round(b/t*100));
  const diff=100-r.reduce((a,b)=>a+b,0); r[r.indexOf(Math.max(...r))]+=diff; return r;
}

let S={phase:"intro",name:"",i:0,ans:Array(Q.length).fill(null),saved:false};
const $=s=>document.querySelector(s), stage=$("#stage");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rail(){
  const r=$("#rail"); r.hidden=S.phase!=="q";
  if(r.hidden)return;
  $("#segs").innerHTML=Q.map((q,i)=>`<div class="seg ${i<S.i||(i===S.i&&S.ans[i]!==null)?"done":""} ${i===S.i?"now":""}" style="--c:${CH[q[0]].c}"><i></i></div>`).join("");
  const ch=CH[Q[S.i][0]];
  $("#chLabel").innerHTML=`<span class="dot" style="--c:${ch.c}"></span>${ch.n} · ${ch.m}`;
  $("#count").textContent=`${S.i+1} / ${Q.length}`;
}

function mandalaSVG(cls){
  const petals=CH.map((c,i)=>{const a=i/7*360;return `<g transform="rotate(${a} 100 100)"><ellipse cx="100" cy="44" rx="16" ry="34" fill="${c.c}" opacity=".85"/></g>`}).join("");
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><g class="${cls}">${petals}<circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="1"/>
  ${Array.from({length:28},(_,i)=>`<circle cx="${100+92*Math.cos(i/28*6.283)}" cy="${100+92*Math.sin(i/28*6.283)}" r="1.6" fill="var(--gold)"/>`).join("")}</g>
  <circle cx="100" cy="100" r="34" fill="var(--night)" stroke="var(--gold)" stroke-width="1.5"/><text x="100" y="112" text-anchor="middle" font-family="var(--f-skt)" font-size="34" fill="var(--gold)">ॐ</text></svg>`;
}

function renderIntro(){
  stage.innerHTML=`<section class="intro enter">
   <div>
    <p class="skt">यथा पिण्डे तथा ब्रह्माण्डे</p>
    <h1>A quiet mirror for the mind</h1>
    <p>Eighteen small moments from everyday student life. There are no right or wrong answers. Choose what feels most like you, not what sounds best. At the end you'll see your natural constitution, the state of your mind, and the study pattern that suits you.</p>
    <div class="field"><label for="nm">Student's name</label><input id="nm" autocomplete="off" placeholder="e.g. Ananya" value="${esc(S.name)}"></div>
    <button class="cta" id="go" type="button">Begin the journey</button>
    <p class="note" style="margin-top:14px">Keys: 1–4 to choose · → or Enter for next · ← to go back</p>
   </div>
   <div class="mandala">${mandalaSVG("spin")}</div></section>`;
  const nm=$("#nm"); nm.focus();
  nm.addEventListener("input",()=>S.name=nm.value.trim());
  nm.addEventListener("keydown",e=>{if(e.key==="Enter")start()});
  $("#go").onclick=start;
}
function start(){S.phase="q";S.i=0;go()}

function renderQ(){
  const [chi,text,opts]=Q[S.i], ch=CH[chi], pick=S.ans[S.i];
  const rev=pick!==null, p=rev?pcts(S.i,pick):null;
  stage.innerHTML=`<section class="enter" style="--c:${ch.c};display:flex;flex-direction:column;gap:22px">
   <div class="qhead">
    <span class="badge"><span class="dot"></span><span class="skt">${ch.d}</span> ${ch.m}</span>
    <h2 class="qtext">${esc(text)}</h2>
    <p class="hint">Choose the one that is closest to you, even if none is perfect.</p>
   </div>
   <div class="opts ${rev?"revealed":""}" role="radiogroup" aria-label="Answers">
    ${opts.map((o,i)=>`<button type="button" role="radio" aria-checked="${pick===i}" class="opt ${pick===i?"sel":""}" data-i="${i}">
      <span class="fill" style="width:0"></span><span class="k">${i+1}</span><span class="t">${esc(o[0])}</span>
      <span class="pc"><b class="tn" data-to="${rev?p[i]:0}">0</b>% of students</span></button>`).join("")}
   </div>
   <div class="together" id="tog">${rev?togetherText(p[pick]):"Your answer will show how many others walk the same path."}</div>
   <div class="nav">
    <button class="ghost" id="back" type="button">${S.i===0?"Back to start":"Previous"}</button>
    <span class="foot">Starting figures are indicative · every completed session on this device adds to them${store.sessions?` · ${store.sessions} recorded`:""}</span>
    <button class="cta" id="next" type="button" ${rev?"":"disabled"} style="margin:0">${S.i===Q.length-1?"See my reflection":"Next question"}</button>
   </div></section>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  $("#back").onclick=back; $("#next").onclick=next;
  if(rev)animateReveal(p,false);
}
function togetherText(n){
  const msg=n>=25?`<strong>You're not alone.</strong> Many students feel exactly this way.`:n>=15?`<strong>You're in good company.</strong> A meaningful group answers just like you.`:`<strong>A rarer path.</strong> Fewer students answer this way, and that is part of what makes you you.`;
  return `<span class="big tn" id="togN">${n}%</span><span>${msg}</span>`;
}
function animateReveal(p,fresh){
  stage.querySelectorAll(".opt").forEach((b,i)=>{
    const f=b.querySelector(".fill"),n=b.querySelector(".pc b");
    requestAnimationFrame(()=>{f.style.width=p[i]+"%"});
    countUp(n,p[i],fresh?900:0);
  });
}
function countUp(el,to,ms){
  if(!ms||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to;return}
  const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function choose(i){
  S.ans[S.i]=i; const p=pcts(S.i,i);
  const box=stage.querySelector(".opts"); box.classList.add("revealed");
  stage.querySelectorAll(".opt").forEach((b,j)=>{b.classList.toggle("sel",j===i);b.setAttribute("aria-checked",j===i)});
  $("#tog").innerHTML=togetherText(p[i]);
  const tn=$("#togN"); if(tn&&!matchMedia("(prefers-reduced-motion:reduce)").matches){const end=p[i];const t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/900);tn.textContent=Math.round(end*(1-Math.pow(1-k,3)))+"%";if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
  animateReveal(p,true);
  $("#next").disabled=false; rail();
}
function next(){if(S.ans[S.i]===null)return; if(S.i<Q.length-1){S.i++;go()}else{S.phase="reading";go()}}
function back(){if(S.i===0){S.phase="intro";go()}else{S.i--;go()}}

/* ---------- scoring ---------- */
const DOSHA={
 v:{n:"Vata",el:"Air + Space",c:"var(--vata)",
   lead:"Quick, creative, full of ideas",
   desc:"Your mind moves like wind: it learns fast, connects ideas, and gets excited easily. The same speed means attention scatters and things learned fast can fade fast.",
   study:["Study in short sprints of 25 minutes, then move your body for 5.","Keep the same study hour every day. Routine is your anchor.","Revise in rounds: same day, after 3 days, after a week.","Warm meals at fixed times and a fixed bedtime steady your focus."],
   strong:["Languages","Creative writing","Art & design","Idea-led discussion"],weak:["Memory-heavy chapters","Long revision cycles","Lengthy theory"]},
 p:{n:"Pitta",el:"Fire + Water",c:"var(--pitta)",
   lead:"Sharp, focused, driven to win",
   desc:"Your mind burns bright like fire: it understands quickly, loves a clear goal and a good challenge. Watch for perfectionism, comparison and burnout when results don't match the effort.",
   study:["Plan with clear targets and track progress you can see.","Start with the hardest problem while energy is high.","Take cooling breaks: water, a walk, no screens.","Compete with your last score, not with others."],
   strong:["Mathematics","Physics & chemistry","Logic & reasoning","Structured problem-solving"],weak:["Slow literature reading","Group projects needing patience","Repetitive rote work"]},
 k:{n:"Kapha",el:"Earth + Water",c:"var(--kapha)",
   lead:"Steady, patient, deep memory",
   desc:"Your mind is like earth: calm, loyal, and slow to start, but once something is learned it stays for good. Watch for comfort zones, low momentum and putting things off.",
   study:["Begin with 5 minutes of movement to wake the body up.","Study early in the morning, when the mind is lightest.","Use active recall: close the book and explain it aloud.","Set small deadlines and study with a partner who keeps pace."],
   strong:["Biology","History & social studies","Long-term retention","Careful, thorough work"],weak:["Timed speed problems","Fast-paced maths","Last-minute changes"]}
};
const GUNA={s:{n:"Sattva",m:"Clarity & calm",c:"var(--sattva)"},r:{n:"Rajas",m:"Restless drive",c:"var(--rajas)"},t:{n:"Tamas",m:"Heaviness & inertia",c:"var(--tamas)"}};
const SUBJ={mem:"Memory-heavy subjects (history, biology terms)",lang:"Writing-heavy subjects (essays, literature)",num:"Speed and numbers (maths, physics)"};

function score(){
  const d={v:0,p:0,k:0},g={s:0,r:0,t:0},cb=CH.map(()=>({s:0,n:0}));
  S.ans.forEach((a,qi)=>{const o=Q[qi][2][a],w=parseD(o[1]);for(const k in w)d[k]+=w[k];g[o[2]]++;cb[Q[qi][0]].s+=o[3];cb[Q[qi][0]].n++});
  const dt=d.v+d.p+d.k||1,gt=Q.length;
  const dp={v:Math.round(d.v/dt*100),p:Math.round(d.p/dt*100)};dp.k=100-dp.v-dp.p;
  const gp={s:Math.round(g.s/gt*100),r:Math.round(g.r/gt*100)};gp.t=100-gp.s-gp.r;
  const order=["v","p","k"].sort((a,b)=>dp[b]-dp[a]);
  const chak=cb.map(x=>x.n?x.s/(x.n*3):0);
  return{dp,gp,order,chak,dual:dp[order[0]]-dp[order[1]]<=8};
}

function donut(dp,order){
  const R=62,C=2*Math.PI*R;let off=0;
  const segs=["v","p","k"].map(k=>{const len=dp[k]/100*C;const s=`<circle cx="85" cy="85" r="${R}" fill="none" stroke="${DOSHA[k].c}" stroke-width="22" stroke-dasharray="0 ${C}" data-len="${len}" data-gap="${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1)"/>`;off+=len;return s}).join("");
  const top=DOSHA[order[0]];
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Prakriti: Vata ${dp.v}%, Pitta ${dp.p}%, Kapha ${dp.k}%"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--night-2)" stroke-width="22"/>${segs}
  <text x="85" y="82" text-anchor="middle" font-family="var(--f-display)" font-size="22" fill="var(--ink)">${top.n}</text>
  <text x="85" y="102" text-anchor="middle" font-family="var(--f-body)" font-size="13" fill="var(--muted)">${dp[order[0]]}%</text></svg>`;
}
function radar(vals){
  const cx=180,cy=170,R=118,N=7,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const rings=[.25,.5,.75,1].map(f=>`<polygon points="${CH.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes=CH.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  const v=vals.map(x=>Math.max(.12,x));
  const poly=`<polygon class="rpoly" points="${v.map((x,i)=>pt(i,R*x).join(",")).join(" ")}" fill="var(--gold)" fill-opacity=".18" stroke="var(--gold)" stroke-width="2"/>`;
  const dots=v.map((x,i)=>{const[a,b]=pt(i,R*x);return`<circle cx="${a}" cy="${b}" r="6" fill="${CH[i].c}" stroke="var(--night)" stroke-width="2"/>`}).join("");
  const labels=CH.map((c,i)=>{const[x,y]=pt(i,R+26);const anc=Math.abs(x-cx)<10?"middle":x>cx?"start":"end";return`<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" font-family="var(--f-body)" font-size="13" fill="var(--muted)">${c.n}</text><text x="${x}" y="${y+15}" text-anchor="${anc}" dominant-baseline="middle" font-family="var(--f-body)" font-size="12" fill="${c.c}">${Math.round(vals[i]*100)}%</text>`}).join("");
  return `<svg viewBox="-20 0 400 350" role="img" aria-label="Chakra balance">${rings}${spokes}${poly}${dots}${labels}</svg>`;
}

function renderReading(){
  rail();
  stage.innerHTML=`<section class="reading enter"><div>${mandalaSVG("spin fast")}<h2>Reading your pattern…</h2><p class="note">Bringing the eighteen moments together</p></div></section>`;
  const s=stage.querySelector(".spin");if(s)s.style.animationDuration="3s";
  if(!S.saved){S.ans.forEach((a,qi)=>store.counts[qi][a]++);store.sessions++;saveStore(store);S.saved=true}
  setTimeout(()=>{if(S.phase==="reading"){S.phase="report";go()}},matchMedia("(prefers-reduced-motion:reduce)").matches?200:1800);
}

function renderReport(){
  const R=score(),D=DOSHA[R.order[0]],D2=DOSHA[R.order[1]];
  const name=S.name||"You";
  const typeName=R.dual?`${D.n}–${D2.n}`:D.n;
  const gTop=["s","r","t"].sort((a,b)=>R.gp[b]-R.gp[a])[0];
  const subjAns=Q[14][2][S.ans[14]][5];
  const weak=[...(SUBJ[subjAns]?[SUBJ[subjAns]]:[]),...D.weak].slice(0,4);
  const strong=R.dual?[...D.strong.slice(0,2),...D2.strong.slice(0,2)]:D.strong;
  const ci=R.chak.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
  const low=CH[ci[0][1]],high=CH[ci[6][1]];
  const gNote={s:"Your mind already has a calm centre. Protect it with sleep, routine and fewer screens, and it will carry you far.",
               r:"Your mind has plenty of fire and movement. The work now is to point that energy in one direction at a time.",
               t:"Your mind feels a little heavy right now. Small wins, morning light, movement and one trusted person to talk to will lift it."}[gTop];
  const hostQ={0:"Ask about routine: what time do they actually sleep and wake?",1:"Ask how they handle disappointment, and who they tell first.",2:"Ask what usually breaks their study streak.",3:"Ask who they can talk to on a bad day.",4:"Ask them to explain one topic aloud. Notice confidence and recall.",5:"Ask what career ideas they have and where those ideas came from.",6:"Ask what a good life looks like to them, in their own words."};
  const heavy=["They feel pressure from expectations. Explore whose expectations, and how heavy.","They mentioned a fear of not being good enough. Go gently and look for evidence of their strengths.","Distraction is their main struggle. Ask about phone hours and study environment.","They report feeling at peace. Confirm this, and ask what keeps them steady."][S.ans[17]];
  const flags=[];
  if(S.ans[10]===2)flags.push("They tend to keep feelings inside. A gentle check-in, and an offer of counselling support, may help.");
  if(S.ans[13]===2)flags.push("Career clarity is low and may be family-led. Worth a separate conversation.");
  if(R.gp.t>=40)flags.push("Tamas is high. Look at sleep, energy and mood before pushing a study plan.");

  stage.innerHTML=`<section class="enter" style="display:flex;flex-direction:column;gap:20px">
   <div class="rep-head"><span class="eyebrow">Reflection for ${esc(name)}</span>
    <h2>${esc(name==="You"?"Your":name+"'s")} nature leans ${typeName}</h2>
    <p>${D.desc}</p></div>
   <div class="grid">
    <div class="card"><h3>Prakriti · natural constitution</h3>
      <div class="donutwrap">${donut(R.dp,R.order)}
      <div class="legend">${["v","p","k"].map(k=>`<div class="lg" style="--c:${DOSHA[k].c}"><i></i><span>${DOSHA[k].n}<small>${DOSHA[k].el}</small></span><b>${R.dp[k]}%</b></div>`).join("")}</div></div>
      <p class="lead">${D.lead}</p></div>
    <div class="card"><h3>Manas · state of mind</h3>
      <div class="bars">${["s","r","t"].map(k=>`<div class="bar" style="--c:${GUNA[k].c}"><span>${GUNA[k].n}</span><span class="tr"><i data-w="${R.gp[k]}"></i></span><b>${R.gp[k]}%</b></div>`).join("")}</div>
      <p class="lead" style="font-size:22px">Mostly ${GUNA[gTop].n}: ${GUNA[gTop].m.toLowerCase()}</p>
      <p>${gNote}</p></div>
    <div class="card wide radar"><h3>Chakra balance · the seven centres</h3>
      ${radar(R.chak)}
      <p>Strongest centre: <strong style="color:${high.c}">${high.n}</strong> (${high.m.toLowerCase()}). Needs the most care: <strong style="color:${low.c}">${low.n}</strong> (${low.m.toLowerCase()}).</p></div>
    <div class="card wide"><h3>Study pattern that suits a ${D.n} mind</h3>
      <ul class="tick" style="--c:${D.c}">${D.study.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="card"><h3>Natural strengths</h3><div class="chips">${strong.map(x=>`<span class="chip" style="--c:${D.c}">${x}</span>`).join("")}</div></div>
    <div class="card"><h3>Subjects that need extra care</h3><div class="chips">${weak.map(x=>`<span class="chip" style="--c:var(--c1)">${x}</span>`).join("")}</div></div>
   </div>
   <details class="host"><summary>Notes for the interviewer</summary><ul>
     <li>${hostQ[ci[0][1]]}</li><li>${heavy}</li>${flags.map(f=>`<li>${f}</li>`).join("")}
     <li>Constitution: Vata ${R.dp.v}% · Pitta ${R.dp.p}% · Kapha ${R.dp.k}%. Mind: Sattva ${R.gp.s}% · Rajas ${R.gp.r}% · Tamas ${R.gp.t}%.</li>
   </ul></details>
   <p class="note">This is a reflective conversation tool inspired by Ayurvedic ideas, not a medical or psychological diagnosis.</p>
   <div class="nav"><button class="ghost" id="review" type="button">Review answers</button><button class="cta" id="again" type="button" style="margin:0">Start with next student</button></div>
  </section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    stage.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%");
    stage.querySelectorAll("circle[data-len]").forEach(c=>c.setAttribute("stroke-dasharray",`${c.dataset.len} ${c.dataset.gap}`));
  }));
  $("#again").onclick=reset; $("#review").onclick=()=>{S.phase="q";S.i=0;go()};
}

function reset(){S={phase:"intro",name:"",i:0,ans:Array(Q.length).fill(null),saved:false};go()}
function go(){
  rail();
  ({intro:renderIntro,q:renderQ,reading:renderReading,report:renderReport})[S.phase]();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("keydown",e=>{
  if(S.phase!=="q"||e.target.tagName==="INPUT")return;
  if(["1","2","3","4"].includes(e.key))choose(+e.key-1);
  else if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();next()}
  else if(e.key==="ArrowLeft")back();
});
$("#resetBtn").onclick=reset;
$("#fsBtn").onclick=()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
go();
</script>
</body>
</html>
