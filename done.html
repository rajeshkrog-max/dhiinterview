<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dhirise · Preparing your result</title>
<link rel="icon" href="assets/dhirise-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Mukta:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/done.css">
</head>
<body>
<main class="done">
  <img class="logo" src="assets/dhirise-logo-light.png" alt="Dhirise" width="72" height="72"
       onerror="this.onerror=null;this.src='assets/dhirise-logo.png'">

  <!-- wait -->
  <section class="wait" id="wait">
    <div class="fill" aria-hidden="true"><i id="fill"></i></div>
    <p class="line" id="line" aria-live="polite"></p>
    <button type="button" class="gold" id="see" hidden>See your result</button>
  </section>

  <!-- join -->
  <section class="join" id="joinCard" hidden>
    <h1>Your result is ready.</h1>
    <p>Join the Dhirise student community for early access. A quiet group, only for students. Not a noisy feed.</p>
    <form id="join" novalidate>
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="14" placeholder="10-digit number" aria-describedby="phoneErr">
      <p class="err" id="phoneErr" aria-live="polite"></p>
      <button type="submit" class="gold">Join and see my result</button>
    </form>
  </section>
</main>
<script src="js/done.js"></script>
</body>
</html>
